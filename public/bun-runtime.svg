<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f132b"/>
      <stop offset="50%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#090511"/>
    </linearGradient>
    <linearGradient id="bunOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bunViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="bunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="32" fill="url(#bunBg)"/>
  
  <!-- Speed Lines -->
  <line x1="50" y1="120" x2="160" y2="120" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="30" y1="200" x2="130" y2="200" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="60" y1="280" x2="170" y2="280" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  
  <!-- Steaming Bun Character Circle -->
  <circle cx="230" cy="190" r="85" fill="#fef3c7" stroke="url(#bunOrange)" stroke-width="4" filter="url(#bunGlow)"/>
  
  <!-- Cute Face with Glasses -->
  <rect x="185" y="165" width="35" height="22" rx="6" fill="#18181b"/>
  <rect x="235" y="165" width="35" height="22" rx="6" fill="#18181b"/>
  <line x1="220" y1="176" x2="235" y2="176" stroke="#18181b" stroke-width="3"/>
  <path d="M210 215 Q230 230 250 215" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="178" cy="195" r="7" fill="#fca5a5" fill-opacity="0.6"/>
  <circle cx="277" cy="195" r="7" fill="#fca5a5" fill-opacity="0.6"/>

  <!-- Rocket Boost Under Bun -->
  <path d="M205 275 L230 330 L255 275 Z" fill="url(#bunOrange)"/>
  <path d="M215 275 L230 310 L245 275 Z" fill="#fef08a"/>

  <!-- Bun Label -->
  <rect x="140" y="325" width="180" height="34" rx="17" fill="url(#bunViolet)"/>
  <text x="230" y="347" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUN 1.4 SPEED</text>
</svg>
