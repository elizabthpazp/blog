  <rect x="24" y="24" width="448" height="174" rx="18" fill="#0c0a09"/>
  <circle cx="38" cy="38" r="5.5" fill="#ff5f57"/><circle cx="54" cy="38" r="5.5" fill="#ffbd2e"/><circle cx="70" cy="38" r="5.5" fill="#28c840"/>
  <text x="92" y="42" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.55">lib.rs — Rust → WASM</text>
  <text x="24" y="74" font-family="monospace" font-size="11" fill="#fdba74">#[wasm_bindgen]</text>
  <text x="24" y="92" font-family="monospace" font-size="11" fill="#ffffff"><tspan fill="#fb923c">pub fn</tspan> <tspan fill="#7dd3fc">fibonacci</tspan>(n: <tspan fill="#f472b6">u32</tspan>) -> <tspan fill="#f472b6">u32</tspan> {</text>
  <text x="36" y="110" font-family="monospace" font-size="11" fill="#a3a3a3">  <tspan fill="#fb923c">if</tspan> n &lt;= 1 { <tspan fill="#fb923c">return</tspan> n; }</text>
  <text x="36" y="128" font-family="monospace" font-size="11" fill="#a3a3a3">  fibonacci(n-1) + fibonacci(n-2)</text>
  <text x="24" y="146" font-family="monospace" font-size="11" fill="#ffffff">}</text>
  <text x="24" y="170" font-family="monospace" font-size="10" fill="#22c55e" opacity="0.9">✓ Compiled to wasm32 • 12.4 kB gzipped</text>
  <!-- comparison -->
  <g transform="translate(24, 214)">
    <rect width="448" height="84" rx="16" fill="#ffffff"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#9a3412">BENCHMARK • FIBONACCI(40)</text>
    <g transform="translate(16, 38)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#44403c">JavaScript</text>
      <rect x="100" y="4" width="140" height="14" rx="7" fill="#e7e5e4"/>
      <rect x="100" y="4" width="118" height="14" rx="7" fill="#f97316"/>
      <text x="252" y="15" font-family="monospace" font-size="11" font-weight="700" fill="#57534e">890ms</text>
      <text x="0" y="38" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0c0a09">Rust WASM</text>
      <rect x="100" y="28" width="140" height="14" rx="7" fill="#e7e5e4"/>
      <rect x="100" y="28" width="22" height="14" rx="7" fill="#16a34a"/>
      <text x="252" y="39" font-family="monospace" font-size="11" font-weight="800" fill="#16a34a">84ms</text>
    </g>
  </g>
  <!-- Tauri vs Electron -->
