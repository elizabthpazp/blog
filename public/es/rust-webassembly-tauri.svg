    <text x="16" y="48" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#a8a29e">180 MB</text>
    <text x="16" y="66" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">+ Chromium + Node</text>
    <text x="16" y="80" font-family="Inter, sans-serif" font-size="11" fill="#f97316">✕ Pesado</text>
    <rect x="234" width="214" height="88" rx="16" fill="#7c2d12"/>
