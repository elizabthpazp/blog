<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="peBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b2a"/>
      <stop offset="50%" stop-color="#0c071d"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <linearGradient id="peGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="peAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="32" fill="url(#peBg)"/>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#peGlow)" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.6"/>
  
  <!-- Terminal Screen Box -->
  <rect x="70" y="90" width="260" height="190" rx="16" fill="#0f172a" stroke="url(#peGlow)" stroke-width="3" stroke-opacity="0.8"/>
  <rect x="70" y="90" width="260" height="32" rx="16" fill="#1e293b"/>
  
  <!-- Terminal Dots -->
  <circle cx="95" cy="106" r="5" fill="#ef4444"/>
  <circle cx="112" cy="106" r="5" fill="#eab308"/>
  <circle cx="129" cy="106" r="5" fill="#22c55e"/>
  
  <!-- Prompt Code Lines -->
  <text x="95" y="150" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#38bdf8">&gt; SYSTEM: PROMPT_AI</text>
  <rect x="95" y="168" width="160" height="8" rx="4" fill="#a855f7" fill-opacity="0.8"/>
  <rect x="95" y="184" width="210" height="8" rx="4" fill="#64748b" fill-opacity="0.7"/>
  <rect x="95" y="200" width="140" height="8" rx="4" fill="#ec4899" fill-opacity="0.8"/>
  <rect x="95" y="216" width="180" height="8" rx="4" fill="#22c55e" fill-opacity="0.8"/>
  
  <!-- Sparkles / Magic wand -->
  <circle cx="280" cy="150" r="14" fill="url(#peAccent)" filter="drop-shadow(0 0 10px #ec4899)"/>
  <path d="M280 140 L280 160 M270 150 L290 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Badge at bottom -->
  <rect x="110" y="305" width="180" height="36" rx="18" fill="url(#peGlow)"/>
  <text x="200" y="328" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PROMPT ENG 2026</text>
</svg>
