<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="200" fill="#34d399" opacity="0.18"/>
  <circle cx="200" cy="540" r="240" fill="#059669" opacity="0.16"/>
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <text x="64" y="96" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#6ee7b7" opacity="0.95">WEBGPU • 2026 • GPU EN EL BROWSER</text>
  <text x="64" y="158" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">WebGPU en 2026:</text>
  <text x="64" y="214" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#6ee7b7" letter-spacing="-1.5">Aceleración GPU</text>
  <text x="64" y="270" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">en el navegador</text>
  <text x="64" y="320" font-family="Inter, sans-serif" font-size="18" fill="#a7f3d0" opacity="0.9">Compute shaders en JavaScript, IA on-device,</text>
  <text x="64" y="348" font-family="Inter, sans-serif" font-size="18" fill="#a7f3d0" opacity="0.9">juegos 3D y rendimiento 100x vs WebGL.</text>
  <!-- GPU chip illustration -->
  <g transform="translate(880, 380)" opacity="0.95">
    <rect x="-120" y="-100" width="240" height="200" rx="20" fill="#0a1f1a" stroke="#34d399" stroke-width="3"/>
    <rect x="-90" y="-70" width="180" height="140" rx="8" fill="#022c22"/>
    <text x="0" y="6" font-family="monospace" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle">GPU</text>
    <text x="0" y="36" font-family="monospace" font-size="14" fill="#6ee7b7" text-anchor="middle">WGSL</text>
    <!-- pins -->
    <g fill="#34d399" opacity="0.7">
      <rect x="-130" y="-80" width="10" height="6"/><rect x="-130" y="-60" width="10" height="6"/><rect x="-130" y="-40" width="10" height="6"/><rect x="-130" y="-20" width="10" height="6"/>
      <rect x="120" y="-80" width="10" height="6"/><rect x="120" y="-60" width="10" height="6"/><rect x="120" y="-40" width="10" height="6"/><rect x="120" y="-20" width="10" height="6"/>
      <rect x="-80" y="-110" width="6" height="10"/><rect x="-60" y="-110" width="6" height="10"/><rect x="-40" y="-110" width="6" height="10"/><rect x="-20" y="-110" width="6" height="10"/>
      <rect x="20" y="-110" width="6" height="10"/><rect x="40" y="-110" width="6" height="10"/><rect x="60" y="-110" width="6" height="10"/>
      <rect x="-80" y="100" width="6" height="10"/><rect x="-60" y="100" width="6" height="10"/><rect x="-40" y="100" width="6" height="10"/><rect x="-20" y="100" width="6" height="10"/>
      <rect x="20" y="100" width="6" height="10"/><rect x="40" y="100" width="6" height="10"/><rect x="60" y="100" width="6" height="10"/>
    </g>
  </g>
  <!-- Floating chips -->
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card)" stroke="#6ee7b7" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#6ee7b7"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Compute shaders</text>
