<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Astro Islands Icon">
  <defs>
    <linearGradient id="g_astro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060612"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g_astro)"/>
  <g opacity="0.07" fill="#fff">
    <circle cx="80" cy="80" r="5"/><circle cx="150" cy="80" r="5"/><circle cx="220" cy="80" r="5"/><circle cx="290" cy="80" r="5"/><circle cx="360" cy="80" r="5"/><circle cx="430" cy="80" r="5"/>
  </g>
  <circle cx="256" cy="256" r="148" fill="#ffffff" opacity="0.05"/>
  <!-- islands illustration -->
  <g transform="translate(256, 250)">
    <!-- base platform static HTML -->
    <rect x="-148" y="36" width="296" height="72" rx="18" fill="#ffffff" opacity="0.96"/>
    <rect x="-148" y="36" width="296" height="72" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <text x="0" y="56" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">— STATIC HTML — 0 JS —</text>
    <!-- dashed line separating -->
    <line x1="-132" y1="74" x2="132" y2="74" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 6" opacity="0.25"/>
    <!-- islands floating above -->
    <!-- island 1 - left -->
    <g transform="translate(-78, -18)">
      <ellipse cx="0" cy="28" rx="48" ry="14" fill="#020617" opacity="0.18"/>
      <rect x="-44" y="-28" width="88" height="56" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="-36" y="-20" width="72" height="40" rx="10" fill="#0f172a"/>
      <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8">Header</text>
      <text x="0" y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#64748b">static</text>
      <!-- small float shadow -->
      <circle cx="0" cy="-36" r="3" fill="#ffffff" opacity="0.5"/>
    </g>
    <!-- island 2 - center active -->
    <g transform="translate(0, -42)">
      <ellipse cx="0" cy="46" rx="56" ry="16" fill="#020617" opacity="0.22"/>
      <rect x="-52" y="-34" width="104" height="68" rx="18" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
      <rect x="-44" y="-26" width="88" height="52" rx="12" fill="#ffffff" opacity="0.96"/>
      <text x="0" y="-4" text-anchor="middle" font-size="18">⚡</text>
      <text x="0" y="14" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#0e7490">ISLA</text>
      <circle cx="34" cy="-20" r="10" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
      <text x="34" y="-16" text-anchor="middle" font-size="8" fill="#ffffff">✓</text>
      <!-- pulse -->
      <rect x="-52" y="-34" width="104" height="68" rx="18" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.25"/>
    </g>
    <!-- island 3 - right -->
    <g transform="translate(82, -16)">
      <ellipse cx="0" cy="28" rx="44" ry="14" fill="#020617" opacity="0.18"/>
      <rect x="-40" y="-28" width="80" height="56" rx="16" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
      <rect x="-32" y="-20" width="64" height="40" rx="10" fill="#ffffff" opacity="0.96"/>
      <text x="0" y="-2" text-anchor="middle" font-size="14">✦</text>
      <text x="0" y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#6d28d9">ISLA</text>
    </g>
    <!-- connection lines showing islands isolated -->
    <g opacity="0.18" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <path d="M -34 -10 Q 0 6 28 -18"/>
    </g>
  </g>
  <!-- bottom pill -->
  <g transform="translate(256, 428)">
    <rect x="-78" y="-18" width="156" height="36" rx="18" fill="#ffffff"/>
    <text x="0" y="7" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="900" letter-spacing="1.4" fill="#1e1b4b">ASTRO • ISLAS</text>
  </g>
</svg>