<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="200" fill="#a78bfa" opacity="0.18"/>
  <circle cx="200" cy="540" r="240" fill="#7c3aed" opacity="0.16"/>
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <text x="64" y="96" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#fde68a" opacity="0.95">VITE 7 • TURBOPACK • RSPACK • 2026</text>
  <text x="64" y="158" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Vite 7 y Turbopack:</text>
  <text x="64" y="214" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#fde68a" letter-spacing="-1.5">Bundlers 2026</text>
  <text x="64" y="270" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">a velocidad extrema</text>
  <text x="64" y="320" font-family="Inter, sans-serif" font-size="18" fill="#e9d5ff" opacity="0.9">Vite 7, Turbopack estable y Rspack: comparativa</text>
  <text x="64" y="348" font-family="Inter, sans-serif" font-size="18" fill="#e9d5ff" opacity="0.9">real de HMR, build y next-gen tooling en 2026.</text>
  <!-- Speed bars -->
  <g transform="translate(860, 380)" filter="url(#glow)">
    <!-- Vite -->
    <rect x="-160" y="-100" width="300" height="46" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="-150" y="-90" width="180" height="10" rx="5" fill="#646cff"/>
    <text x="-145" y="-70" font-family="monospace" font-size="12" font-weight="900" fill="#1e1b4b">Vite 7 — 38ms HMR ⚡</text>
    <!-- Turbopack -->
    <rect x="-160" y="-46" width="300" height="46" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="-150" y="-36" width="165" height="10" rx="5" fill="#000000"/>
    <text x="-145" y="-16" font-family="monospace" font-size="12" font-weight="900" fill="#000000">Turbopack — 22ms HMR</text>
    <!-- Rspack -->
    <rect x="-160" y="8" width="300" height="46" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="-150" y="18" width="195" height="10" rx="5" fill="#f97316"/>
    <text x="-145" y="38" font-family="monospace" font-size="12" font-weight="900" fill="#7c2d12">Rspack — 41ms HMR</text>
    <!-- Webpack legacy -->
    <rect x="-160" y="62" width="300" height="46" rx="10" fill="#ffffff" opacity="0.45"/>
    <rect x="-150" y="72" width="90" height="10" rx="5" fill="#6b7280"/>
    <text x="-145" y="92" font-family="monospace" font-size="11" fill="#4b5563">Webpack — 420ms</text>
  </g>
  <g transform="translate(700, 108)">
    <rect x="0" y="0" width="190" height="42" rx="10" fill="url(#card)" stroke="#fde68a" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#facc15"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">HMR &lt;50ms</text>
  </g>
  <g transform="translate(720, 162)">
    <rect x="0" y="0" width="190" height="42" rx="10" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#a78bfa"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Rust-powered</text>
  </g>
  <g transform="translate(740, 216)">
    <rect x="0" y="0" width="190" height="42" rx="10" fill="url(#card)" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="22" cy="21" r="8" fill="#34d399"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Vite 7 stable</text>
  </g>
</svg>