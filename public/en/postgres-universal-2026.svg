<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="120" r="200" fill="#38bdf8" opacity="0.16"/>
  <circle cx="180" cy="540" r="240" fill="#0284c7" opacity="0.14"/>
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <text x="64" y="96" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#7dd3fc" opacity="0.95">POSTGRES • 2026 • UNIVERSAL DB</text>
  <text x="64" y="158" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Postgres en 2026:</text>
  <text x="64" y="214" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#7dd3fc" letter-spacing="-1.5">La única base de datos</text>
  <text x="64" y="270" font-family="Inter, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">que necesitas</text>
  <text x="64" y="320" font-family="Inter, sans-serif" font-size="18" fill="#bae6fd" opacity="0.9">pgvector, Neon, Supabase, Edge, JSON,全文检索 y RAG</text>
  <text x="64" y="348" font-family="Inter, sans-serif" font-size="18" fill="#bae6fd" opacity="0.9">en un solo motor relacional.</text>
  <!-- Elephant silhouette + SQL -->
  <g transform="translate(900, 430)" opacity="0.95">
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="#ffffff"/>
    <ellipse cx="80" cy="-30" rx="40" ry="35" fill="#ffffff"/>
    <path d="M 100 -10 Q 130 -30 150 -10 Q 140 30 110 25" fill="#ffffff"/>
    <rect x="-90" y="60" width="20" height="40" rx="4" fill="#ffffff"/>
    <rect x="40" y="60" width="20" height="40" rx="4" fill="#ffffff"/>
    <circle cx="90" cy="-40" r="5" fill="#0284c7"/>
    <text x="-60" y="-5" font-family="monospace" font-size="22" font-weight="700" fill="#0284c7">SELECT *</text>
    <text x="-60" y="20" font-family="monospace" font-size="14" fill="#0ea5e9">FROM future;</text>
  </g>
  <!-- Floating vector chips -->
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#7dd3fc"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">pgvector 0.8</text>
  </g>
  <g transform="translate(740, 165)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#7dd3fc"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Neon serverless</text>
  </g>
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#7dd3fc"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Postgres 17</text>
  </g>
</svg>