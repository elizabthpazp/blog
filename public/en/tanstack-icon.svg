  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g_tan)"/>
  <g opacity="0.07" fill="#fff">
    <circle cx="72" cy="72" r="5"/><circle cx="152" cy="72" r="5"/><circle cx="232" cy="72" r="5"/><circle cx="312" cy="72" r="5"/><circle cx="392" cy="72" r="5"/>
    <circle cx="72" cy="152" r="5"/><circle cx="152" cy="152" r="5"/><circle cx="232" cy="152" r="5"/><circle cx="312" cy="152" r="5"/><circle cx="392" cy="152" r="5"/>
    <circle cx="72" cy="392" r="5"/><circle cx="152" cy="392" r="5"/><circle cx="232" cy="392" r="5"/><circle cx="312" cy="392" r="5"/><circle cx="392" cy="392" r="5"/>
  </g>
  <circle cx="256" cy="256" r="158" fill="#ffffff" opacity="0.06"/>
  <circle cx="256" cy="256" r="124" fill="#ffffff" opacity="0.08"/>
  <!-- Stack icon -->
