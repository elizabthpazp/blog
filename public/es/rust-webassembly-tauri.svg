<text x="64" y="590" font-family="Inter, sans-serif" font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.32">BLOG.ELIJS.DEV • RUST • WEBASSEMBLY • TAURI • PERFORMANCE</text>
