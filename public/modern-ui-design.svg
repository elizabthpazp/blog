<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="50%" stop-color="#0f071d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="32" fill="url(#uiBg)"/>
  
  <!-- Glowing Background Sphere -->
  <circle cx="280" cy="140" r="70" fill="url(#sphereGrad)" filter="url(#glassBlur)" fill-opacity="0.8"/>
  <circle cx="120" cy="280" r="55" fill="#38bdf8" filter="url(#glassBlur)" fill-opacity="0.6"/>

  <!-- Floating Glass Card 1 (Back) -->
  <rect x="110" y="80" width="200" height="130" rx="20" fill="url(#cardGrad1)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(-6 210 145)"/>
  
  <!-- Floating Glass Card 2 (Front) -->
  <rect x="90" y="150" width="220" height="150" rx="24" fill="url(#cardGrad2)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" transform="rotate(4 200 225)"/>
  
  <!-- Content Inside Front Card -->
  <circle cx="140" cy="195" r="16" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="170" y="185" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="170" y="202" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
  
  <rect x="120" y="235" width="160" height="32" rx="16" fill="#7c3aed" fill-opacity="0.9"/>
  <text x="200" y="256" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UI GLASS 2026</text>
</svg>
