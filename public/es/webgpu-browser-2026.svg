    <circle cx="22" cy="21" r="8" fill="#6ee7b7"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">IA on-device</text>
  </g>
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#card)" stroke="#6ee7b7" stroke-opacity="0.4"/>
    <circle cx="22" cy="21" r="8" fill="#6ee7b7"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Chrome 138+ ready</text>
