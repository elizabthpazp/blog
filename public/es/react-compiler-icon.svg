<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="React Compiler Icon">
  <defs>
    <linearGradient id="g_rc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g_rc)"/>
  <g opacity="0.07" fill="#fff">
    <circle cx="72" cy="72" r="5"/><circle cx="152" cy="72" r="5"/><circle cx="232" cy="72" r="5"/><circle cx="312" cy="72" r="5"/><circle cx="392" cy="72" r="5"/>
    <circle cx="72" cy="152" r="5"/><circle cx="152" cy="152" r="5"/><circle cx="232" cy="152" r="5"/><circle cx="312" cy="152" r="5"/><circle cx="392" cy="152" r="5"/>
    <circle cx="72" cy="392" r="5"/><circle cx="152" cy="392" r="5"/><circle cx="232" cy="392" r="5"/><circle cx="312" cy="392" r="5"/><circle cx="392" cy="392" r="5"/>
  </g>
  <circle cx="256" cy="256" r="158" fill="#ffffff" opacity="0.06"/>
  <circle cx="256" cy="256" r="124" fill="#ffffff" opacity="0.08"/>
  <!-- React atom + compiler badge -->
  <g transform="translate(256, 256)">
    <!-- React atom -->
    <ellipse cx="0" cy="0" rx="92" ry="36" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="92" ry="36" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.95" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="92" ry="36" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.95" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="18" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
    <!-- Compiler spark -->
    <g transform="translate(68, -68)">
      <circle cx="0" cy="0" r="26" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
      <text x="0" y="8" font-family="monospace" font-size="22" font-weight="900" fill="#0c4a6e" text-anchor="middle">⚡</text>
    </g>
    <!-- Crossed useMemo badge bottom -->
    <g transform="translate(0, 98)">
      <rect x="-78" y="-14" width="156" height="28" rx="8" fill="#ffffff" opacity="0.95"/>
      <text x="0" y="5" font-family="monospace" font-size="11" font-weight="800" fill="#0c4a6e" text-anchor="middle">auto-memo</text>
    </g>
  </g>
  <text x="256" y="450" font-family="monospace" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">REACT COMPILER</text>
